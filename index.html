<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Casa">
<meta name="theme-color" content="#f4f5f9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1115" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="icon.png">
<link rel="manifest" href="manifest.json">
<title>Controle da Casa</title>
<style>
:root{
  --bg:#f4f5f9;--card:#fff;--txt:#14161c;--sub:#6b7280;--line:#e7e8ee;--pri:#4f46e5;--pri2:#7c3aed;
  --ok:#059669;--bad:#dc2626;--warn:#b45309;--warnbg:#fef3c7;--chip:#eef0f5;
  --b1:#0ea5e9;--b2:#8b5cf6;--b3:#f97316;--b4:#10b981;--shadow:0 1px 2px rgba(0,0,0,.04),0 4px 16px rgba(0,0,0,.05);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0f1115;--card:#1a1d24;--txt:#f1f3f7;--sub:#9aa1ad;--line:#2a2e37;--chip:#252933;--warnbg:#3a2c10;--warn:#fbbf24;--shadow:none;
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt);font:16px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
body{padding:env(safe-area-inset-top) 0 calc(78px + env(safe-area-inset-bottom));overscroll-behavior-y:none}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:560px;margin:0 auto;padding:8px 16px 24px}
h1{font-size:30px;font-weight:800;letter-spacing:-.02em;margin:10px 0 2px}
h2{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--sub);margin:22px 4px 8px}
.card{background:var(--card);border-radius:18px;box-shadow:var(--shadow);padding:16px}
.muted{color:var(--sub)}.small{font-size:13px}.right{text-align:right}.neg{color:var(--bad)}.pos{color:var(--ok)}
.row{display:flex;align-items:center;gap:12px}.grow{flex:1;min-width:0}.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.monthbar{display:flex;align-items:center;justify-content:space-between;margin:4px 0 10px}
.monthbar button{border:0;background:var(--card);box-shadow:var(--shadow);width:38px;height:38px;border-radius:12px;font-size:20px;cursor:pointer}
.monthbar .m{font-weight:700;font-size:17px;text-transform:capitalize}
.hero{background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;border-radius:22px;padding:20px;box-shadow:0 10px 30px rgba(79,70,229,.3)}
.hero .lbl{opacity:.8;font-size:14px}.hero .big{font-size:36px;font-weight:800;letter-spacing:-.02em;margin:2px 0 14px}
.hero .duo{display:flex;gap:10px}.hero .duo>div{flex:1;background:rgba(255,255,255,.14);border-radius:14px;padding:10px 12px}
.hero .duo b{display:block;font-size:17px;margin-top:2px}
.alert{display:flex;align-items:center;gap:12px;background:var(--warnbg);color:var(--warn);border-radius:16px;padding:14px 16px;margin-top:14px;font-weight:600;cursor:pointer;border:0;width:100%;text-align:left}
.alert .go{margin-left:auto;font-size:20px}
.bucket{margin:12px 0}.bucket:first-child{margin-top:0}.bucket .top{display:flex;justify-content:space-between;font-size:14px;margin-bottom:6px}
.bar{position:relative;height:10px;background:var(--chip);border-radius:6px;overflow:visible}
.bar i{position:absolute;left:0;top:0;bottom:0;border-radius:6px}
.bar .ideal{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--txt);opacity:.55;border-radius:1px}
.cat{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line);cursor:pointer}.cat:first-child{border-top:0;padding-top:0}
.ico{width:38px;height:38px;border-radius:12px;background:var(--chip);display:grid;place-items:center;font-size:19px;flex:none}
.mini{height:5px;background:var(--chip);border-radius:3px;margin-top:6px}.mini i{display:block;height:100%;border-radius:3px;background:var(--pri)}
.year{display:flex;align-items:flex-end;gap:6px;height:130px;padding-top:8px}
.year .col{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;height:100%;justify-content:flex-end}
.year .stk{position:relative;width:100%;flex:1;display:flex;align-items:flex-end;justify-content:center}
.year .d{width:70%;border-radius:5px 5px 2px 2px;background:var(--pri);opacity:.35}
.year .d.over{background:var(--bad)}
.year .r{position:absolute;left:8%;right:8%;height:2px;background:var(--ok)}
.year .col.sel .d{opacity:1}.year .l{font-size:11px;color:var(--sub)}.year .col.sel .l{color:var(--txt);font-weight:700}
.legend{display:flex;gap:14px;font-size:12px;color:var(--sub);margin-top:10px}.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:0;background:var(--card);box-shadow:var(--shadow);padding:8px 14px;border-radius:999px;font-size:14px;font-weight:500;cursor:pointer}
.chip.on{background:var(--txt);color:var(--bg)}
.search{width:100%;border:0;background:var(--card);box-shadow:var(--shadow);border-radius:14px;padding:12px 14px;margin-bottom:10px;outline:none}
.list{background:var(--card);border-radius:18px;box-shadow:var(--shadow);overflow:hidden}
.item{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line);cursor:pointer}.item:first-child{border-top:0}
.item:active{background:var(--chip)}
.item .t{font-weight:600;font-size:15px}.item .s{font-size:13px;color:var(--sub);margin-top:1px}
.item .v{font-weight:700;font-size:15px;white-space:nowrap}
.tag{display:inline-block;font-size:11px;font-weight:600;padding:2px 7px;border-radius:6px;background:var(--chip);color:var(--sub);margin-left:4px;vertical-align:1px}
.tag.parc{background:color-mix(in srgb,var(--pri) 14%,var(--card));color:var(--pri);margin-left:0}
.item .tag:first-child{margin-left:0}
.tag.sms{background:#e0e7ff;color:#4338ca}.tag.ok{background:#d1fae5;color:#047857}.tag.warn{background:var(--warnbg);color:var(--warn)}
@media (prefers-color-scheme:dark){.tag.sms{background:#2e2f6b;color:#c7d2fe}.tag.ok{background:#0f3b2e;color:#6ee7b7}}
.day{font-size:13px;font-weight:600;color:var(--sub);margin:16px 4px 6px;text-transform:capitalize}
.sum{display:flex;justify-content:space-between;align-items:baseline;margin:2px 4px 10px;font-size:14px}
.empty{text-align:center;color:var(--sub);padding:40px 20px}
.tabs{position:fixed;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--card) 88%,transparent);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-top:1px solid var(--line);display:flex;justify-content:space-around;align-items:center;padding:6px 8px calc(6px + env(safe-area-inset-bottom));z-index:20}
.tabs button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--sub);padding:4px 10px;cursor:pointer;min-width:62px}
.tabs button svg{width:25px;height:25px}.tabs button.on{color:var(--pri)}
.tabs .fab{width:54px;height:54px;border-radius:18px;background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;font-size:30px;line-height:1;margin-top:-26px;box-shadow:0 8px 20px rgba(79,70,229,.4);display:grid;place-items:center;min-width:0;padding:0}
.badge{position:absolute;margin-left:18px;margin-top:-4px;background:var(--bad);color:#fff;font-size:10px;font-weight:700;border-radius:9px;padding:1px 5px}
.sheetbg{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:30;opacity:0;transition:opacity .2s;pointer-events:none}
.sheetbg.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:92vh;overflow:auto;background:var(--bg);border-radius:22px 22px 0 0;z-index:31;transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.8,.2,1);padding:8px 16px calc(20px + env(safe-area-inset-bottom));max-width:600px;margin:0 auto}
.sheet.on{transform:none}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 10px}
.sheet h3{margin:4px 0 14px;font-size:20px;display:flex;justify-content:space-between;align-items:center}
.x{border:0;background:var(--chip);width:32px;height:32px;border-radius:50%;font-size:18px;cursor:pointer}
.field{background:var(--card);border-radius:14px;padding:10px 14px;margin-bottom:10px;box-shadow:var(--shadow)}
.field label{display:block;font-size:12px;color:var(--sub);margin-bottom:2px}
.field input,.field select,.field textarea{width:100%;border:0;background:none;outline:none;padding:2px 0;font-size:17px}
.field textarea{min-height:110px;font-size:14px;resize:vertical}
.money{font-size:34px!important;font-weight:800}
.catgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.catgrid button{border:0;background:var(--card);box-shadow:var(--shadow);border-radius:14px;padding:10px 4px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;cursor:pointer;min-height:68px}
.catgrid button span{font-size:22px}.catgrid button.on{outline:2.5px solid var(--pri);background:color-mix(in srgb,var(--pri) 10%,var(--card))}
.seg{display:flex;background:var(--chip);border-radius:12px;padding:3px;margin-bottom:14px}
.seg button{flex:1;border:0;background:none;padding:8px;border-radius:10px;font-weight:600;font-size:14px;cursor:pointer;color:var(--sub)}
.seg button.on{background:var(--card);color:var(--txt);box-shadow:var(--shadow)}
.btn{width:100%;border:0;border-radius:14px;padding:15px;font-weight:700;font-size:17px;cursor:pointer;background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;margin-top:6px}
.btn.sec{background:var(--card);color:var(--txt);box-shadow:var(--shadow)}.btn.danger{background:none;color:var(--bad);box-shadow:none}
.btn:disabled{opacity:.5}
.chk{display:flex;gap:10px;align-items:center;background:var(--card);border-radius:14px;padding:12px 14px;margin-bottom:10px;box-shadow:var(--shadow);font-size:14px}
.chk input[type=checkbox]{width:22px;height:22px;accent-color:var(--pri);flex:none}
.chk input[type=text]{border:0;border-bottom:1px dashed var(--sub);background:none;outline:none;font-weight:700;width:9em;font-size:14px}
.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top));transform:translate(-50%,-150%);background:var(--txt);color:var(--bg);padding:11px 18px;border-radius:14px;font-weight:600;font-size:14px;z-index:50;transition:transform .25s;max-width:90vw;text-align:center}
.toast.on{transform:translate(-50%,0)}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{background:var(--card);border-radius:16px;padding:14px 10px;text-align:center;box-shadow:var(--shadow)}.tile b{display:block;font-size:26px}.tile span{font-size:12px;color:var(--sub)}
.menu .item .ico{background:color-mix(in srgb,var(--pri) 12%,var(--card))}
.back{border:0;background:none;color:var(--pri);font-size:17px;padding:8px 0;cursor:pointer;font-weight:500}
.big1{background:var(--card);border-radius:18px;padding:20px;text-align:center;box-shadow:var(--shadow);margin-bottom:14px}
.big1 .v{font-size:32px;font-weight:800;margin:6px 0}
.spin{display:inline-block;width:18px;height:18px;border:2.5px solid var(--line);border-top-color:var(--pri);border-radius:50%;animation:s .8s linear infinite;vertical-align:-3px}
@keyframes s{to{transform:rotate(360deg)}}
.loading{position:fixed;top:calc(10px + env(safe-area-inset-top));right:14px;z-index:40}
.setup{min-height:90vh;display:flex;flex-direction:column;justify-content:center}
.logo{width:72px;height:72px;border-radius:20px;background:linear-gradient(135deg,var(--pri),var(--pri2));display:grid;place-items:center;font-size:38px;margin-bottom:12px;box-shadow:0 10px 30px rgba(79,70,229,.3)}
details summary{cursor:pointer;list-style:none}
.brand,.fab-txt,.side-foot,.tabs .so-pc{display:none}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.kpi{background:var(--card);border-radius:16px;padding:12px 14px;box-shadow:var(--shadow)}.kpi span{display:block;font-size:12px;color:var(--sub)}.kpi b{font-size:19px}.kpi small{display:block;font-size:11px;color:var(--sub)}
.kpis .kpi:first-child{grid-column:1/-1}
.tabela-wrap{overflow-x:auto;background:var(--card);border-radius:16px;box-shadow:var(--shadow);-webkit-overflow-scrolling:touch}
.tabela{--c0:150px;--cm:66px;--ct:80px;border-collapse:separate;border-spacing:0;font-size:13px;white-space:nowrap;table-layout:fixed;width:calc(var(--c0) + 12 * var(--cm) + var(--ct))}
.tabela col.k0{width:var(--c0)}.tabela col.km{width:var(--cm)}.tabela col.kt{width:var(--ct)}
.tabela th,.tabela td{padding:8px 10px;text-align:right;border-bottom:1px solid var(--line)}
.tabela th{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--sub);font-weight:600;position:sticky;top:0;background:var(--card)}
.tabela .c0{text-align:left;position:sticky;left:0;background:var(--card);z-index:1;overflow:hidden;text-overflow:ellipsis;box-shadow:1px 0 0 var(--line)}
@media (min-width: 900px){.tabela{--c0:220px;--cm:calc((100% - 220px - 92px) / 12);--ct:92px;width:100%;min-width:1080px}}
.tabela th.c0{z-index:2}
.tabela .hoje{background:#eaf3ff}
.tabela th.hoje{color:#2563eb}
.tabela tr.ttot td.hoje,.tabela tr.grp td.hoje{background:#dbeafe}
@media (prefers-color-scheme:dark){.tabela .hoje{background:#13233d}}
.tabela .tot{font-weight:700;background:var(--chip)}
.tabela tr.grp td{font-weight:700;background:color-mix(in srgb,var(--chip) 60%,var(--card));cursor:pointer}
.tabela tr.grp td.c0{background:color-mix(in srgb,var(--chip) 60%,var(--card))}
.tabela tr.sub td.c0{padding-left:18px;color:var(--txt)}.tabela tr.sub .ic{margin-right:6px}
.tabela td.clic{cursor:pointer}.tabela td.clic:hover{color:var(--pri);text-decoration:underline}
.tabela tr.ttot td{font-weight:700;background:color-mix(in srgb,var(--pri) 4%,var(--card))}
.tabela tr.ttot td.c0{background:color-mix(in srgb,var(--pri) 4%,var(--card))}
.tabela tr.ttot.ultimo td{border-bottom:2px solid var(--line)}
.mesgrid{display:grid;gap:12px}
.mescard.atual{outline:2px solid #60a5fa;background:#eaf3ff}
@media (prefers-color-scheme:dark){.mescard.atual{outline-color:#3b82f6;background:#13233d}}
.mescard.atual .tag.sms{background:#2563eb;color:#fff}
.tri{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0 4px}.tri span{display:block;font-size:11px;color:var(--sub)}.tri b{font-size:15px}
.lbar{margin-top:10px}
.dica{display:flex;gap:12px;align-items:flex-start;background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:13px 14px;margin-bottom:8px;border-left:4px solid var(--line)}
.dica .di{font-size:22px;line-height:1.1}.dica .dt{font-weight:600;font-size:15px}.dica .dx{font-size:13px;color:var(--sub);margin-top:3px}
.dica.alto{border-left-color:var(--bad)}.dica.medio{border-left-color:var(--b3)}.dica.ok{border-left-color:var(--ok)}.dica.info{border-left-color:var(--pri)}
.dica .eco{margin-left:auto;white-space:nowrap;font-weight:700;color:var(--ok);font-size:14px;padding-left:8px}
.catan{padding:12px 14px;border-top:1px solid var(--line);cursor:pointer}.catan:first-child{border-top:0}
.catan .row{gap:8px}.catan .bar{height:8px;margin-top:7px}
.trend{font-size:12px;font-weight:600}.trend.up{color:var(--bad)}.trend.down{color:var(--ok)}
.an-grid{display:block}
@media (min-width:900px){.an-grid{display:grid;grid-template-columns:1.15fr 1fr;gap:18px;align-items:start}.an-grid h2:first-child{margin-top:4px}}
.toolbar .search{margin-bottom:10px}
/* ===== Computador / tablet na horizontal ===== */
@media (min-width: 900px){
  body{padding:0 0 0 236px}
  .wrap{max-width:1180px;padding:26px 40px 64px}
  .wrap.tab-lanc,.wrap.tab-faturas,.wrap.tab-mais{max-width:980px}
  h1{font-size:32px;margin-top:4px}
  .monthbar{max-width:440px}
  .tabs{top:0;bottom:0;left:0;right:auto;width:236px;flex-direction:column;justify-content:flex-start;align-items:stretch;gap:4px;padding:22px 14px;border-top:0;border-right:1px solid var(--line);background:var(--card);backdrop-filter:none;-webkit-backdrop-filter:none}
  .tabs .brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:17px;padding:2px 10px 18px}
  .tabs .brand .logo-s{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--pri),var(--pri2));display:grid;place-items:center;font-size:18px}
  .tabs button{flex-direction:row;justify-content:flex-start;font-size:15px;gap:12px;padding:11px 14px;border-radius:12px;min-width:0;color:var(--txt);font-weight:500}
  .tabs button:hover{background:var(--chip)}
  .tabs button svg{width:21px;height:21px;color:var(--sub)}
  .tabs button.on{background:color-mix(in srgb,var(--pri) 12%,transparent);color:var(--pri);font-weight:600}
  .tabs button.on svg{color:var(--pri)}
  .tabs .badge{position:static;margin:0 0 0 auto;font-size:11px;padding:2px 7px;order:3}
  .tabs .fab{order:-1;width:auto;height:auto;margin:0 0 14px;border-radius:14px;font-size:15px;font-weight:700;padding:12px 14px;display:flex;justify-content:center;align-items:center;gap:8px;color:#fff;box-shadow:0 6px 16px rgba(79,70,229,.3)}
  .tabs .fab:hover{filter:brightness(1.07);background:linear-gradient(135deg,var(--pri),var(--pri2))}
  .tabs .fab .fab-plus{font-size:22px;line-height:1}
  .tabs .fab .fab-txt{display:inline}
  .tabs .brand{order:-2}
  .tabs .side-foot{display:block;margin-top:auto;padding:10px 14px;font-size:13px;color:var(--sub);border-top:1px solid var(--line)}
  .tabs .side-foot a{color:var(--bad);text-decoration:none;font-weight:600}
  .toolbar .search{max-width:460px;margin-bottom:12px}
  .chips{flex-wrap:wrap;overflow:visible;padding-bottom:6px}
  .chip:hover{filter:brightness(.97)}
  .item:hover{background:var(--chip)}
  .item .s.ell{white-space:normal}
  .dash{column-count:2;column-gap:28px}
  .dash>div{break-inside:avoid;-webkit-column-break-inside:avoid;display:inline-block;width:100%;margin-bottom:6px}
  .dash .d-a{padding-top:2px}
  .year{height:170px}
  .lote-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(400px,1fr));gap:0 14px}
  .tab-faturas .big1.dropzone{padding:44px 20px}
  .sheet{left:50%;right:auto;bottom:auto;top:50%;width:560px;max-width:92vw;max-height:88vh;border-radius:22px;padding:18px 22px 22px;transform:translate(-50%,-46%) scale(.98);opacity:0;pointer-events:none;transition:opacity .16s,transform .16s;box-shadow:0 30px 80px rgba(0,0,0,.25)}
  .sheet.on{transform:translate(-50%,-50%);opacity:1;pointer-events:auto}
  .grab{display:none}
  .catgrid{grid-template-columns:repeat(5,1fr)}
  .tabs .so-pc{display:flex}
  .wrap.tab-ano{max-width:1500px}
  .wrap.tab-acomp{max-width:1280px}
  .kpis{grid-template-columns:repeat(5,1fr)}.kpis .kpi:first-child{grid-column:auto}
  .tabela{font-size:13.5px}.tabela th,.tabela td{padding:9px 10px}
  .mesgrid{grid-template-columns:repeat(auto-fill,minmax(330px,1fr))}
  .setup{max-width:440px;margin:0 auto}
  body:has(.setup){padding-left:0}
}details summary::-webkit-details-marker{display:none}
</style>
</head>
<body>
<div id="app"></div>
<div class="sheetbg" id="sheetbg"></div>
<div class="sheet" id="sheet"></div>
<div class="toast" id="toast"></div>
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js" defer></script>
<script>
// Lê a fatura exportada do Bradesco Internet Banking (.xls) já convertida em matriz de linhas.
// Retorna { linhas:[{cartao,titular,data,descricao,valor,usd}], cartoes:[{cartao,titular,total}], total, mesSugerido }
// Linhas que não são compras: saldo da fatura anterior e pagamentos (débito em conta, Pix antecipado, etc.)
var NAO_COMPRA = /^\s*(SALDO ANTERIOR|PAGTO\b|PAGTO\.|PAGAMENTO\b)/i;
function lerFaturaBradesco(rows, hojeISO, fechamento) {
  var linhas = [], cartoes = [], atual = null, total = null, colBRL = 3, colUSD = 2, colHist = 1;
  function ultimo(c) { for (var i = c.length - 1; i >= 1; i--) if (c[i]) return c[i]; return ''; }
  function txt(v) { return v === null || v === undefined ? '' : String(v).trim(); }
  function numBR(v) {
    if (typeof v === 'number') return v;
    var s = txt(v); if (!s) return 0;
    if (s.indexOf(',') >= 0) s = s.replace(/\./g, '').replace(',', '.');
    var n = parseFloat(s); return isNaN(n) ? 0 : n;
  }
  rows.forEach(function (r) {
    var c = (r || []).map(txt);
    var a = c[0] || '';
    var cab = a.match(/^(.+?)\s+-\s+(\d{4})$/);
    if (cab && !c.slice(1).join('')) { atual = { cartao: cab[2], titular: cab[1], total: 0 }; cartoes.push(atual); return; }
    if (/^Data$/i.test(a)) {
      c.forEach(function (h, i) {
        if (/hist/i.test(h)) colHist = i;
        else if (/US\$/i.test(h)) colUSD = i;
        else if (/R\$/i.test(h)) colBRL = i;
      });
      return;
    }
    if (/^Total da fatura em Real/i.test(a)) { total = numBR(ultimo(c)); return; }
    if (/^\d{2}\/\d{2}$/.test(a) && atual) {
      var desc = (c[colHist] || '').replace(/\s+/g, ' ');
      var valor = numBR(c[colBRL]);
      linhas.push({ cartao: atual.cartao, titular: atual.titular, data: a, descricao: desc, valor: valor, usd: numBR(c[colUSD]) });
      if (!NAO_COMPRA.test(desc)) atual.total = Math.round((atual.total + valor) * 100) / 100;
    }
  });
  // mês sugerido: a fatura cobre ~30 dias de compras (de ~29 do mês M-1 a ~28 do mês M) e vence no mês M+1.
  // Usa a data MEDIANA das compras à vista / 1ª parcela, que não é afetada pelo dia exato do fechamento (28, 29 ou 30).
  var hoje = hojeISO || new Date().toISOString().slice(0, 10);
  var datas = [];
  linhas.forEach(function (l) {
    if (NAO_COMPRA.test(l.descricao) || /ANUIDADE/i.test(l.descricao)) return;
    var pm = l.descricao.match(/\s(\d{1,2})\/(\d{1,2})$/);
    if (pm && +pm[1] > 1) return;
    var m = +l.data.slice(3, 5), y = +hoje.slice(0, 4);
    var iso = y + '-' + (m < 10 ? '0' : '') + m + '-' + l.data.slice(0, 2);
    if (iso > hoje) { y -= 1; iso = y + iso.slice(4); }
    datas.push(iso);
  });
  var mesSugerido = '';
  if (datas.length) {
    datas.sort();
    var mediana = datas[Math.floor(datas.length / 2)];
    var yy = +mediana.slice(0, 4), mm = +mediana.slice(5, 7) + 1;
    if (mm > 12) { mm -= 12; yy++; }
    mesSugerido = yy + '-' + (mm < 10 ? '0' : '') + mm;
  }
  var compras = 0, saldoAnterior = 0, pagamentos = 0;
  linhas.forEach(function (l) {
    if (/^\s*SALDO ANTERIOR/i.test(l.descricao)) saldoAnterior += l.valor;
    else if (NAO_COMPRA.test(l.descricao)) pagamentos += l.valor;
    else compras += l.valor;
  });
  var r2 = function (n) { return Math.round(n * 100) / 100; };
  return { linhas: linhas, cartoes: cartoes, total: total, compras: r2(compras), saldoAnterior: r2(saldoAnterior), pagamentos: r2(pagamentos), mesSugerido: mesSugerido };
}
if (typeof module !== 'undefined') module.exports = { lerFaturaBradesco: lerFaturaBradesco, NAO_COMPRA: NAO_COMPRA };

function avisoLote(x, i, cartoesDe) {
  const meus = cartoesDe(x);
  const outros = S.lote.filter((y, j) => j !== i && y.mes === x.mes);
  const repetido = outros.find(y => cartoesDe(y).some(c => meus.includes(c)));
  if (repetido) return `<div class="alert" style="margin:0;cursor:default;background:#fee2e2;color:var(--bad)"><span>❗</span><span>Este arquivo e "${esc(repetido.nome)}" têm os mesmos cartões em ${nomeMes(x.mes)}. Confira o mês ou remova um deles (×).</span></div>`;
  let html = '';
  if (outros.length) html += `<div class="alert" style="margin:0 0 8px;cursor:default;background:color-mix(in srgb,var(--pri) 10%,var(--card));color:var(--pri)"><span>➕</span><span>Faz parte da fatura de ${nomeMes(x.mes)} junto com ${outros.map(y => '"' + esc(y.nome) + '"').join(', ')} (outros cartões). Os valores serão somados.</span></div>`;
  const h = faturaDoMes(x.mes);
  if (h) {
    const ja = String(h.cartoes || '').split(',').filter(Boolean);
    const comuns = meus.filter(c => ja.includes(c));
    if (!ja.length || comuns.length) html += `<div class="alert" style="margin:0;cursor:default"><span style="font-size:20px">⚠️</span><span>${ja.length ? 'Os cartões ' + comuns.join(', ') + ' de' : 'A fatura de'} ${nomeMes(x.mes)} já foram importados em ${quando(h.importado_em)}.<br><span class="small" style="font-weight:500">Importar de novo substitui esses cartões, sem duplicar.</span></span></div>`;
    else html += `<div class="alert" style="margin:0;cursor:default;background:color-mix(in srgb,var(--pri) 10%,var(--card));color:var(--pri)"><span>➕</span><span>${nomeMes(x.mes)} já tem os cartões ${ja.join(', ')} importados. Este arquivo traz outros cartões e será somado.</span></div>`;
  }
  return html;
}
function avisoJaHtml(m) {

function primeiro(s) { const p = String(s || '').split(' ')[0]; return p.charAt(0) + p.slice(1).toLowerCase(); }
async function esperarLeitor() {
  for (let i = 0; i < 50 && !window.XLSX; i++) await new Promise(r => setTimeout(r, 200));
  if (!window.XLSX) throw new Error('Não consegui carregar o leitor de Excel. Verifique a internet e tente de novo.');
}
async function lerArquivos(files, somar) {
  files = Array.from(files || []).filter(f => /\.(xls|xlsx|csv)$/i.test(f.name) || /excel|spreadsheet|csv/.test(f.type));
  if (!files.length) { toast('Escolha arquivos .xls da fatura do Bradesco'); return; }
  S.tab = 'faturas'; S.resultados = null;
  if (!somar || !S.lote) S.lote = [];
  try { await esperarLeitor(); } catch (e) { toast(e.message); return; }
  const ruins = [];
  for (const file of files) {
    try {
      const buf = await file.arrayBuffer();
      const wb = XLSX.read(buf, { type: 'array' });
      const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1, raw: false, defval: '' });
      const f = lerFaturaBradesco(rows, hojeISO(), +S.dados.config.fechamento || 29);
      if (!f.linhas.length) { ruins.push(file.name); continue; }
      S.lote.push({ nome: file.name, f, mes: f.mesSugerido || S.mes });
    } catch (e) { ruins.push(file.name); }
  }
  S.lote.sort((a, b) => a.mes.localeCompare(b.mes));
  render(); window.scrollTo(0, 0);
  if (ruins.length) toast('Não reconheci como fatura do Bradesco: ' + ruins.join(', '));
}
async function importarLote() {
  const lote = S.lote.slice(), b = $('#btnImp'), out = [];
  b.disabled = true;
  setLoading(true);
  for (let i = 0; i < lote.length; i++) {
    b.innerHTML = `<span class="spin"></span> Importando ${i + 1} de ${lote.length}…`;
    try { out.push({ mes: lote[i].mes, nome: lote[i].nome, r: await apiPost({ action: 'fatura', mes: lote[i].mes, linhas: lote[i].f.linhas }) }); }
    catch (e) { out.push({ mes: lote[i].mes, nome: lote[i].nome, erro: e.message }); }
  }
  setLoading(false);
  invalidar(); await carregar(S.mes, true);
  S.lote = null; S.resultados = out; render(); window.scrollTo(0, 0);
  toast(out.every(x => x.r) ? (out.length > 1 ? out.length + ' arquivos importados' : 'Fatura importada') : 'Alguns arquivos não foram importados');
}

function haQuanto(iso) {
  if (!iso) return '';
  const min = Math.round((Date.now() - Date.parse(iso)) / 60000);
  if (min < 1) return 'agora'; if (min < 60) return 'há ' + min + ' min';
  const h = Math.round(min / 60); if (h < 24) return 'há ' + h + ' h';
  const d = Math.round(h / 24); return 'há ' + d + (d > 1 ? ' dias' : ' dia');
}

    <div class="card small"><b>Como funciona</b><p class="muted" style="margin:6px 0 0">Uma automação no app Atalhos do seu iPhone envia cada SMS "COMPRA APROVADA" do Bradesco Cartões para o servidor. O passo a passo está no guia de instalação, na parte "Leitura de SMS".</p></div>
    <button class="btn sec" id="btnAtuSms" style="margin-top:14px" onclick="atualizarSms()">🔄 Atualizar</button>
    <p class="small muted" style="text-align:center;margin:6px 0 0">${S.smsVerificado ? 'Última verificação: hoje às ' + S.smsVerificado : 'Toque em Atualizar para buscar mensagens novas.'}</p>
    <button class="btn sec" onclick="abrirNovo('sms')">Colar SMS manualmente</button>`;
}
async function atualizarSms() {
  const b = $('#btnAtuSms');
  if (b) { b.disabled = true; b.innerHTML = '<span class="spin"></span> Atualizando…'; }
  const antes = S.dados.sms_status || {}, chaveAntes = (antes.em || '') + '|' + ((antes.ultimo || {}).criado || '');
  try {
    invalidar(); await carregar(S.mes, true);
    const st = S.dados.sms_status || {}, chaveDepois = (st.em || '') + '|' + ((st.ultimo || {}).criado || '');
    S.smsVerificado = new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
    render();
    if (chaveDepois === chaveAntes) toast('Atualizado: nenhuma mensagem nova desde ' + (st.em ? quando(st.em) : 'a instalação'));
    else if (st.ok === 'sim') toast('✅ Mensagem nova recebida: ' + ((st.ultimo || {}).descricao || 'compra'));
    else toast('⚠️ Chegou uma mensagem nova, mas não foi reconhecida');
  } catch (e) {
    toast('Não consegui atualizar: ' + e.message);
    if (b) { b.disabled = false; b.innerHTML = '🔄 Atualizar'; }
  }
}
function vParcelas() {
  const P = S.dados.parcelas;
  return `${voltar}<h1>Parcelas futuras</h1>${P.length ? P.map(p => `<details class="card" style="margin-bottom:10px"><summary class="row"><span class="grow" style="text-transform:capitalize;font-weight:600">${nomeMes(p.mes)}</span><b>${brl(p.total)}</b><span class="muted">›</span></summary>
    <div style="margin-top:10px">${p.itens.sort((a, b) => b.valor - a.valor).map(i => `<div class="row small" style="padding:6px 0;border-top:1px solid var(--line)"><span class="grow ell">${esc(i.descricao)}</span><span class="muted">${esc(i.parcela)}</span><b>${brl(i.valor)}</b></div>`).join('')}</div></details>`).join('') : '<div class="empty">Sem parcelas futuras registradas.<br>Elas aparecem ao importar faturas.</div>'}`;
}
function vFixos() {

    return `<h2>${t}</h2><div class="list">${L.map(r => `<div class="item" onclick="editarRec('${r.id}')" style="${ativo(r) ? '' : 'opacity:.5'}"><div class="ico">${tipo === 'receita' ? '💰' : catInfo(r.categoria).icone}</div><div class="grow"><div class="t">${esc(r.descricao)}</div><div class="s">${nomeMes(r.inicio, 1)}/${r.inicio.slice(2, 4)} → ${r.fim ? nomeMes(r.fim, 1) + '/' + r.fim.slice(2, 4) : 'sem fim'}${r.pessoa ? ' · ' + esc(r.pessoa) : ''}</div></div><div class="v">${brl(r.valor)}</div></div>`).join('')}</div>`; };
  return `${voltar}<h1>Fixos</h1><p class="muted small" style="margin:0 4px">Entram automaticamente em todo mês do período. Para mudar um valor a partir de um mês, encerre o atual e crie outro.</p>
    ${bloco('receita', 'Receitas')}${bloco('despesa', 'Despesas')}<button class="btn" style="margin-top:16px" onclick="editarRec('')">Adicionar fixo</button>`;
}
function vCartoes() {
  return `${voltar}<h1>Cartões</h1><p class="muted small" style="margin:0 4px 12px">Quem é o titular de cada final (usado nos SMS e faturas).</p><div class="list">${S.dados.cartoes.map(c => `<div class="item"><div class="ico">💳</div><div class="grow"><div class="t">•••• ${esc(c.final)}</div></div><input value="${esc(c.titular)}" style="border:0;background:var(--chip);border-radius:10px;padding:8px 10px;width:130px" onchange="acao({action:'cartao_salvar',item:{final:'${esc(c.final)}',titular:this.value,apelido:''}},'Salvo')"></div>`).join('')}</div>`;
}
function vRegras() {
  return `${voltar}<h1>Regras</h1><p class="muted small" style="margin:0 4px 12px">Se a descrição da compra contém o texto, a categoria é aplicada sozinha. As mais acima têm prioridade.</p><div class="list">${S.dados.regras.map(r => `<div class="item"><div class="ico">${catInfo(r.categoria).icone}</div><div class="grow"><div class="t ell">${esc(r.padrao)}</div><div class="s">${esc(r.categoria)}</div></div><button class="x" onclick='if(confirm("Remover regra?"))acao({action:"regra_excluir",padrao:${JSON.stringify(r.padrao)}},"Removida")'>×</button></div>`).join('')}</div>`;
}
function vConta() {
  return `${voltar}<h1>Minha conta</h1><div class="big1"><div style="font-size:40px">👤</div><div class="v" style="font-size:22px">${esc(S.cfg.nome)}</div><div class="muted">usuário: ${esc(S.cfg.usuario)}</div></div>
    <h2>Trocar senha</h2><div class="field"><label>Senha atual</label><input id="sa" type="password" autocomplete="current-password"></div>

}
async function trocarSenha() {

  try { const r = await apiPost({ action: 'senha_trocar', atual: a, nova: n }); S.cfg.token = r.sessao; LS.set('sessao', S.cfg); toast('Senha trocada'); S.sub = null; render(); }

function vUsuarios() {

    <div class="list">${U.map(u => `<div class="item"><div class="ico">👤</div><div class="grow"><div class="t">${esc(u.nome)}</div><div class="s">${esc(u.usuario)}${u.usuario === S.cfg.usuario ? ' · você' : ''}</div></div>${u.usuario === S.cfg.usuario ? '' : `<button class="x" onclick='if(confirm("Remover o acesso de ${esc(u.nome)}?"))acao({action:"usuario_excluir",usuario:${JSON.stringify(u.usuario)}},"Removido")'>×</button>`}</div>`).join('')}</div>
    <h2>Novo usuário</h2><div class="field"><label>Nome</label><input id="un" placeholder="Ex.: Tatiana"></div>

    <p class="small muted" style="margin:10px 4px">Depois a pessoa pode trocar a senha em Mais → Minha conta.</p>`;

}

// ---------- login ----------
let modoLogin = 'entrar';
function vLogin() {
  const pedeServidor = !/^https:\/\//.test(SERVIDOR);
  const srv = pedeServidor ? `<div class="field"><label>Endereço do servidor (termina em /exec)</label><input id="lsv" value="${esc(LS.get('servidor', ''))}" placeholder="https://script.google.com/macros/s/…/exec" autocapitalize="off" autocorrect="off"></div>` : '';
  const topo = `<div class="logo">🏠</div><h1>Controle da Casa</h1>`;
  if (modoLogin === 'entrar') return `<div class="wrap setup">${topo}<p class="muted">Entre com seu usuário e senha.</p>
    <form onsubmit="entrar();return false">${srv}<div class="field"><label>Usuário</label><input id="lu" autocomplete="username" autocapitalize="off" autocorrect="off" value="${esc(LS.get('ultimoUsuario', ''))}"></div>
    <div class="field"><label>Senha</label><input id="ls" type="password" autocomplete="current-password"></div>
    <button class="btn" id="lb" type="submit">Entrar</button></form><p class="small neg" id="le">${esc(S.msgLogin || '')}</p>
    <button class="btn danger" style="color:var(--pri);font-weight:500;font-size:15px" onclick="modoLogin='primeiro';render()">Primeiro acesso ou esqueci a senha</button><p class="small muted" style="text-align:center;margin-top:24px">App versão ${VERSAO_APP}</p></div>`;
  return `<div class="wrap setup">${topo}<p class="muted">Use a <b>chave de instalação</b> (o token da aba Config da planilha) para criar seu acesso ou definir uma senha nova.</p>
    <form onsubmit="primeiroAcesso();return false">${srv}<div class="field"><label>Chave de instalação</label><input id="pc" autocapitalize="off" autocorrect="off"></div>
    <div class="field"><label>Seu nome</label><input id="pn" placeholder="Ex.: Fabio"></div>
    <div class="field"><label>Usuário</label><input id="pu" placeholder="Ex.: fabio" autocapitalize="off" autocorrect="off" autocomplete="username"></div>
    <div class="field"><label>Senha (mín. 6 caracteres)</label><input id="ps" type="password" autocomplete="new-password"></div>
    <div class="field"><label>Repita a senha</label><input id="ps2" type="password" autocomplete="new-password"></div>
    <button class="btn" id="lb" type="submit">Criar acesso e entrar</button></form><p class="small neg" id="le"></p>
    <button class="btn danger" style="color:var(--pri);font-weight:500;font-size:15px" onclick="modoLogin='entrar';render()">‹ Voltar</button></div>`;
}
function urlServidor() {
  const el = $('#lsv'); const u = el ? el.value.trim() : servidor();
  if (!/^https:\/\/script\.google(usercontent)?\.com\//.test(u)) throw new Error('Endereço do servidor inválido');
  if (el) LS.set('servidor', u);
  return u;
}
async function concluirLogin(url, r) {
  S.cfg = { url, token: r.sessao, usuario: r.usuario, nome: r.nome };
  LS.set('sessao', S.cfg); LS.set('ultimoUsuario', r.usuario); S.msgLogin = '';
  S.tab = 'inicio'; S.sub = null; S.dados = null; S.cache = {};
  render(); await carregar(S.mes); toast('Olá, ' + r.nome + '!');
}
async function tentar(fn) {
  const b = $('#lb'), e = $('#le'); e.textContent = ''; b.disabled = true; const t = b.innerHTML; b.innerHTML = '<span class="spin"></span>';
  try { await fn(); } catch (err) { e.textContent = err.message === 'Failed to fetch' ? 'Sem conexão com o servidor' : err.message; b.disabled = false; b.innerHTML = t; }
}
function entrar() {
  tentar(async () => {
    const url = urlServidor();
    const r = await postSem(url, { action: 'login', usuario: $('#lu').value, senha: $('#ls').value });
    if (r.erro) throw new Error(r.erro);
    await concluirLogin(url, r);
  });
}
function primeiroAcesso() {
  tentar(async () => {
    if ($('#ps').value !== $('#ps2').value) throw new Error('As senhas não são iguais');
    const url = urlServidor();
    const r = await postSem(url, { action: 'primeiro_acesso', chave: $('#pc').value, nome: $('#pn').value, usuario: $('#pu').value, senha: $('#ps').value });
    if (r.erro) throw new Error(r.erro);
    modoLogin = 'entrar';
    await concluirLogin(url, r);
  });
}
function sair(expirou) {
  if (!expirou && S.cfg) postSem(S.cfg.url, { action: 'logout', token: S.cfg.token }).catch(() => {});
  LS.del('sessao'); Object.keys(localStorage || {}).forEach(k => { if (k.startsWith('cache_')) LS.del(k); });
  S.cfg = null; S.dados = null; S.cache = {}; S.msgLogin = expirou ? 'Sua sessão expirou. Entre de novo.' : '';
  closeSheet(); render();
}

// ---------- folhas (bottom sheets) ----------
function openSheet(html) { $('#sheet').innerHTML = '<div class="grab"></div>' + html; $('#sheet').classList.add('on'); $('#sheetbg').classList.add('on'); $('#sheet').scrollTop = 0; }
function closeSheet() { $('#sheet').classList.remove('on'); $('#sheetbg').classList.remove('on'); }
document.getElementById('sheetbg').onclick = closeSheet;
function catGrid(tipo, sel, onpick) {
  return `<div class="catgrid">${S.dados.categorias.filter(c => (c.tipo || 'despesa') === tipo).map(c => `<button type="button" class="${c.nome === sel ? 'on' : ''}" onclick="${onpick}('${esc(c.nome)}',this)"><span>${c.icone}</span>${esc(c.nome)}</button>`).join('')}</div>`;
}
function marcaCat(nome, el) { el.parentNode.querySelectorAll('button').forEach(b => b.classList.remove('on')); el.classList.add('on'); el.parentNode.dataset.sel = nome; }
function selCat(root) { const g = (root || document).querySelector('.catgrid'); return g ? (g.dataset.sel || (g.querySelector('.on') ? g.querySelector('.on').textContent.replace(/^\S+\s*/, '').trim() : '')) : ''; }

// novo lançamento
let novoTipo = 'despesa';
function abrirNovo(tipo) {
  novoTipo = tipo || novoTipo;
  const seg = (t, n) => `<button class="${novoTipo === t ? 'on' : ''}" onclick="abrirNovo('${t}')">${n}</button>`;
  let corpo;
  if (novoTipo === 'sms') {
    corpo = `<div class="field"><label>Cole aqui um ou vários SMS do Bradesco Cartões</label><textarea id="nsms" placeholder="BRADESCO CARTOES: COMPRA APROVADA NO CARTAO FINAL…"></textarea></div><button class="btn" onclick="enviarSms()">Ler SMS</button>`;
  } else {
    const cartoes = S.dados.cartoes.map(c => `<option value="${esc(c.final)}">Cartão •••• ${esc(c.final)} (${esc(c.titular)})</option>`).join('');
    corpo = `<div class="field"><label>Valor</label><input id="nv" class="money" inputmode="decimal" placeholder="0,00"></div>
      <div class="field"><label>Descrição</label><input id="nd" placeholder="${novoTipo === 'receita' ? 'Ex.: Bônus, reembolso…' : 'Ex.: Feira, Pix diarista…'}"></div>
      ${catGrid(novoTipo, '', 'marcaCat')}
      <div class="row" style="gap:10px"><div class="field grow"><label>Data</label><input id="ndt" type="date" value="${hojeISO()}"></div>
      ${novoTipo === 'despesa' ? `<div class="field" style="width:110px"><label>Parcelas</label><input id="np" type="number" min="1" max="48" value="1" inputmode="numeric"></div>` : ''}</div>
      ${novoTipo === 'despesa' ? `<div class="field"><label>Forma de pagamento</label><select id="nc"><option value="">Pix / débito / dinheiro</option>${cartoes}</select></div>`
        : `<div class="field"><label>Pessoa</label><select id="npe"><option>Fabio</option><option>Tatiana</option><option value="">Casa</option></select></div>`}
      <button class="btn" onclick="salvarNovo()">Salvar</button>`;
  }
  openSheet(`<h3>Novo lançamento<button class="x" onclick="closeSheet()">×</button></h3><div class="seg">${seg('despesa', 'Gasto')}${seg('receita', 'Receita')}${seg('sms', 'Colar SMS')}</div>${corpo}`);
}
async function salvarNovo() {
  const valor = $('#nv').value, desc = $('#nd').value.trim(), cat = selCat($('#sheet'));
  if (!valor) return toast('Informe o valor');
  const b = { action: 'lancar', tipo: novoTipo, valor, descricao: desc || cat || 'Lançamento', categoria: cat, data: $('#ndt').value };
  if (novoTipo === 'despesa') { b.cartao = $('#nc').value; b.parcelas = +$('#np').value || 1; } else b.pessoa = $('#npe').value;
  closeSheet();
  const r = await acao(b, 'Lançado');
  if (r && r.inseridos && r.inseridos[0].mes !== S.mes) toast('Lançado em ' + nomeMes(r.inseridos[0].mes) + ' (fatura)');
}
async function enviarSms() {
  const t = $('#nsms').value; if (!t.trim()) return;
  closeSheet();
  const r = await acao({ action: 'sms', texto: t, manual: true });
  toast(r.inseridos.length ? `${r.inseridos.length} compra(s) registrada(s)${r.repetidos ? ', ' + r.repetidos + ' já existia(m)' : ''}` : (r.repetidos ? 'Esses SMS já estavam registrados' : (r.msg || 'Nenhuma compra encontrada')));
}

// editar lançamento
function acharLanc(id) { return S.dados.lancamentos.find(l => l.id === id) || S.dados.pendentes.find(l => l.id === id); }
function sugerePadrao(desc) {
  let t = String(desc).toUpperCase().replace(/\s\d{1,2}\/\d{1,2}$/, '').trim();
  const tk = t.split(' ');
  let p = tk[0];
  if ((p.length < 6 || /^(MP\*|EC|IFD\*|PG \*|PAG\*|STORE|LOJA|SHOP)/.test(p)) && tk[1]) p = tk[0] + ' ' + tk[1];
  if (p.includes('-') && p.split('-')[0].length >= 5) p = p.split('-')[0];
  return p;
}
function editar(id) {
  if (id.startsWith('r:')) return editarRec(id.slice(2));
  const l = acharLanc(id); if (!l) return;
  openSheet(`<h3>${l.tipo === 'receita' ? 'Receita' : 'Despesa'}<button class="x" onclick="closeSheet()">×</button></h3>
    <div class="field"><label>Valor</label><input id="ev" class="money" inputmode="decimal" value="${String(l.valor).replace('.', ',')}"></div>
    <div class="field"><label>Descrição</label><input id="ed" value="${esc(l.descricao)}"></div>
    ${catGrid(l.tipo, l.categoria, 'marcaCatEd')}
    <div class="chk" id="regraBox" style="display:${l.categoria ? 'none' : 'flex'}"><input type="checkbox" id="er" ${l.categoria ? '' : 'checked'}><span>Sempre que tiver <input type="text" id="ep" value="${esc(sugerePadrao(l.descricao))}"> usar esta categoria</span></div>
    <div class="row" style="gap:10px"><div class="field grow"><label>Mês de referência</label><input id="em" type="month" value="${l.mes}"></div><div class="field grow"><label>Pessoa</label><input id="epe" value="${esc(l.pessoa)}"></div></div>
    <p class="small muted" style="margin:0 4px 10px">${esc([dataBonita(l.data), l.cartao ? '•••• ' + l.cartao : '', l.parcela ? 'parcela ' + l.parcela : '', 'origem: ' + l.origem, l.conciliado ? 'conferido na fatura de ' + nomeMes(String(l.conciliado).split('|')[0]) : ''].filter(Boolean).join(' · '))}</p>
    <button class="btn" onclick="salvarEd('${esc(l.id)}')">Salvar</button><button class="btn danger" onclick="if(confirm('Excluir este lançamento?')){closeSheet();acao({action:'excluir',id:'${esc(l.id)}'},'Excluído')}">Excluir</button>`);
}
function marcaCatEd(nome, el) { marcaCat(nome, el); $('#regraBox').style.display = 'flex'; }
async function salvarEd(id) {
  const campos = { valor: $('#ev').value, descricao: $('#ed').value, mes: $('#em').value, pessoa: $('#epe').value };
  const cat = selCat($('#sheet')); if (cat) campos.categoria = cat;
  const b = { action: 'atualizar', id, campos };
  if (cat && $('#er').checked && $('#ep').value.trim()) b.regra = { padrao: $('#ep').value.trim() };
  closeSheet();
  const r = await acao(b, 'Salvo');
  if (r && r.aplicados) toast(`Salvo · regra aplicada a mais ${r.aplicados}`);
}

// classificar pendentes, um por um
function classificar() {
  const P = S.dados.pendentes;
  if (!P.length) { closeSheet(); toast('Tudo classificado 🎉'); return; }
  const l = P[0];
  openSheet(`<h3>Classificar <span class="muted small" style="font-weight:500">${P.length} restante${P.length > 1 ? 's' : ''}</span><button class="x" onclick="closeSheet()">×</button></h3>
    <div class="big1"><div class="muted small">${esc([dataBonita(l.data), l.pessoa, l.cartao ? '•••• ' + l.cartao : '', l.parcela].filter(Boolean).join(' · '))}</div><div class="v">${brl(l.valor)}</div><div style="font-weight:700">${esc(l.descricao)}</div></div>
    ${catGrid(l.tipo, '', 'escolheClass')}
    <div class="chk"><input type="checkbox" id="cr" checked><span>Lembrar para <input type="text" id="cp" value="${esc(sugerePadrao(l.descricao))}"></span></div>
    <button class="btn sec" onclick="pularClass()">Pular</button>`);
  $('#sheet').dataset.id = l.id;
}
async function escolheClass(nome, el) {
  marcaCat(nome, el);
  const id = $('#sheet').dataset.id;
  const b = { action: 'atualizar', id, campos: { categoria: nome } };
  if ($('#cr').checked && $('#cp').value.trim()) b.regra = { padrao: $('#cp').value.trim() };
  const P = S.dados.pendentes;
  S.dados.pendentes = P.filter(x => x.id !== id);
  setLoading(true);
  try { const r = await apiPost(b); invalidar(); if (r.aplicados) { toast(`+${r.aplicados} classificada(s) pela regra`); } await carregar(S.mes, true); }
  catch (e) { toast('Erro: ' + e.message); }
  finally { setLoading(false); }
  classificar();
}
function pularClass() { const P = S.dados.pendentes; P.push(P.shift()); classificar(); }

// fixos
function editarRec(id) {
  const r = S.dados.recorrentes.find(x => x.id === id) || { id: '', tipo: 'despesa', descricao: '', valor: '', categoria: '', pessoa: '', inicio: S.mes, fim: '' };
  openSheet(`<h3>${id ? 'Editar fixo' : 'Novo fixo'}<button class="x" onclick="closeSheet()">×</button></h3>
    <div class="seg"><button class="${r.tipo === 'despesa' ? 'on' : ''}" onclick="this.parentNode.dataset.t='despesa';this.classList.add('on');this.nextElementSibling.classList.remove('on')">Despesa</button><button class="${r.tipo === 'receita' ? 'on' : ''}" onclick="this.parentNode.dataset.t='receita';this.classList.add('on');this.previousElementSibling.classList.remove('on')">Receita</button></div>
    <div class="field"><label>Valor mensal</label><input id="rv" class="money" inputmode="decimal" value="${String(r.valor).replace('.', ',')}"></div>
    <div class="field"><label>Descrição</label><input id="rd" value="${esc(r.descricao)}"></div>
    <div class="field"><label>Categoria</label><select id="rc">${S.dados.categorias.map(c => `<option ${c.nome === r.categoria ? 'selected' : ''}>${esc(c.nome)}</option>`).join('')}</select></div>
    <div class="row" style="gap:10px"><div class="field grow"><label>Início</label><input id="ri" type="month" value="${r.inicio}"></div><div class="field grow"><label>Fim (vazio = sem fim)</label><input id="rf" type="month" value="${r.fim}"></div></div>
    <div class="field"><label>Pessoa</label><input id="rp" value="${esc(r.pessoa)}"></div>
    <button class="btn" onclick="salvarRec('${r.id}','${r.tipo}')">Salvar</button>${id ? `<button class="btn danger" onclick="if(confirm('Excluir este fixo de todos os meses?')){closeSheet();acao({action:'recorrente_excluir',id:'${r.id}'},'Excluído')}">Excluir</button>` : ''}`);
}
function salvarRec(id, tipo0) {
  const tipo = $('#sheet .seg').dataset.t || tipo0;
  const item = { id, tipo, valor: $('#rv').value, descricao: $('#rd').value, categoria: $('#rc').value, inicio: $('#ri').value, fim: $('#rf').value, pessoa: $('#rp').value };
  if (!item.valor || !item.inicio) return toast('Preencha valor e início');
  closeSheet(); acao({ action: 'recorrente_salvar', item }, 'Salvo');
}

// ---------- início ----------
(function boot() {
  render();
  if (S.cfg) carregar(S.mes);
  document.addEventListener('visibilitychange', () => { if (!document.hidden && S.cfg) { invalidar(); carregar(S.mes, true); } });
})();
</script>
</body>
</html>
