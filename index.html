<style>
:root{
  --bg:#f4f5f9;--card:#fff;--txt:#14161c;--sub:#6b7280;--line:#e7e8ee;--pri:#4f46e5;--pri2:#7c3aed;
  --ok:#059669;--bad:#dc2626;--warn:#b45309;--warnbg:#fef3c7;--chip:#eef0f5;
  --b1:#0ea5e9;--b2:#8b5cf6;--b3:#f97316;--b4:#10b981;--shadow:0 1px 2px rgba(0,0,0,.04),0 4px 16px rgba(0,0,0,.05);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0f1115;--card:#1a1d24;--txt:#f1f3f7;--sub:#9aa1ad;--line:#2a2e37;--chip:#252933;--warnbg:#3a2c10;--warn:#fbbf24;--shadow:none;
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt);font:16px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
body{padding:env(safe-area-inset-top) 0 calc(78px + env(safe-area-inset-bottom));overscroll-behavior-y:none}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:560px;margin:0 auto;padding:8px 16px 24px}
h1{font-size:30px;font-weight:800;letter-spacing:-.02em;margin:10px 0 2px}
h2{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--sub);margin:22px 4px 8px}
.card{background:var(--card);border-radius:18px;box-shadow:var(--shadow);padding:16px}
.muted{color:var(--sub)}.small{font-size:13px}.right{text-align:right}.neg{color:var(--bad)}.pos{color:var(--ok)}
.row{display:flex;align-items:center;gap:12px}.grow{flex:1;min-width:0}.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.monthbar{display:flex;align-items:center;justify-content:space-between;margin:4px 0 10px}
.monthbar button{border:0;background:var(--card);box-shadow:var(--shadow);width:38px;height:38px;border-radius:12px;font-size:20px;cursor:pointer}
.monthbar .m{font-weight:700;font-size:17px;text-transform:capitalize}
.hero{background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;border-radius:22px;padding:20px;box-shadow:0 10px 30px rgba(79,70,229,.3)}
.hero .lbl{opacity:.8;font-size:14px}.hero .big{font-size:36px;font-weight:800;letter-spacing:-.02em;margin:2px 0 14px}
.hero .duo{display:flex;gap:10px}.hero .duo>div{flex:1;background:rgba(255,255,255,.14);border-radius:14px;padding:10px 12px}
.hero .duo b{display:block;font-size:17px;margin-top:2px}
.alert{display:flex;align-items:center;gap:12px;background:var(--warnbg);color:var(--warn);border-radius:16px;padding:14px 16px;margin-top:14px;font-weight:600;cursor:pointer;border:0;width:100%;text-align:left}

.bucket{margin:12px 0}.bucket:first-child{margin-top:0}.bucket .top{display:flex;justify-content:space-between;font-size:14px;margin-bottom:6px}

.bar .ideal{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--txt);opacity:.55;border-radius:1px}
.cat{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line);cursor:pointer}.cat:first-child{border-top:0;padding-top:0}
.ico{width:38px;height:38px;border-radius:12px;background:var(--chip);display:grid;place-items:center;font-size:19px;flex:none}
.mini{height:5px;background:var(--chip);border-radius:3px;margin-top:6px}.mini i{display:block;height:100%;border-radius:3px;background:var(--pri)}
.year{display:flex;align-items:flex-end;gap:6px;height:130px;padding-top:8px}
.year .col{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;height:100%;justify-content:flex-end}
.year .stk{position:relative;width:100%;flex:1;display:flex;align-items:flex-end;justify-content:center}
.year .d{width:70%;border-radius:5px 5px 2px 2px;background:var(--pri);opacity:.35}
.year .d.over{background:var(--bad)}

.year .col.sel .d{opacity:1}.year .l{font-size:11px;color:var(--sub)}.year .col.sel .l{color:var(--txt);font-weight:700}

.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}

.search{width:100%;border:0;background:var(--card);box-shadow:var(--shadow);border-radius:14px;padding:12px 14px;margin-bottom:10px;outline:none}

.sheet.on{transform:none}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 10px}
.sheet h3{margin:4px 0 14px;font-size:20px;display:flex;justify-content:space-between;align-items:center}
.x{border:0;background:var(--chip);width:32px;height:32px;border-radius:50%;font-size:18px;cursor:pointer}
.field{background:var(--card);border-radius:14px;padding:10px 14px;margin-bottom:10px;box-shadow:var(--shadow)}
.field label{display:block;font-size:12px;color:var(--sub);margin-bottom:2px}
.field input,.field select,.field textarea{width:100%;border:0;background:none;outline:none;padding:2px 0;font-size:17px}
.field textarea{min-height:110px;font-size:14px;resize:vertical}
.money{font-size:34px!important;font-weight:800}
.catgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.catgrid button{border:0;background:var(--card);box-shadow:var(--shadow);border-radius:14px;padding:10px 4px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;cursor:pointer;min-height:68px}
.catgrid button span{font-size:22px}.catgrid button.on{outline:2.5px solid var(--pri);background:color-mix(in srgb,var(--pri) 10%,var(--card))}
.seg{display:flex;background:var(--chip);border-radius:12px;padding:3px;margin-bottom:14px}
.seg button{flex:1;border:0;background:none;padding:8px;border-radius:10px;font-weight:600;font-size:14px;cursor:pointer;color:var(--sub)}
.seg button.on{background:var(--card);color:var(--txt);box-shadow:var(--shadow)}
.btn{width:100%;border:0;border-radius:14px;padding:15px;font-weight:700;font-size:17px;cursor:pointer;background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;margin-top:6px}
.btn.sec{background:var(--card);color:var(--txt);box-shadow:var(--shadow)}.btn.danger{background:none;color:var(--bad);box-shadow:none}
.btn:disabled{opacity:.5}
.chk{display:flex;gap:10px;align-items:center;background:var(--card);border-radius:14px;padding:12px 14px;margin-bottom:10px;box-shadow:var(--shadow);font-size:14px}
.chk input[type=checkbox]{width:22px;height:22px;accent-color:var(--pri);flex:none}
.chk input[type=text]{border:0;border-bottom:1px dashed var(--sub);background:none;outline:none;font-weight:700;width:9em;font-size:14px}
.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top));transform:translate(-50%,-150%);background:var(--txt);color:var(--bg);padding:11px 18px;border-radius:14px;font-weight:600;font-size:14px;z-index:50;transition:transform .25s;max-width:90vw;text-align:center}
.toast.on{transform:translate(-50%,0)}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{background:var(--card);border-radius:16px;padding:14px 10px;text-align:center;box-shadow:var(--shadow)}.tile b{display:block;font-size:26px}.tile span{font-size:12px;color:var(--sub)}
.menu .item .ico{background:color-mix(in srgb,var(--pri) 12%,var(--card))}
.back{border:0;background:none;color:var(--pri);font-size:17px;padding:8px 0;cursor:pointer;font-weight:500}
.big1{background:var(--card);border-radius:18px;padding:20px;text-align:center;box-shadow:var(--shadow);margin-bottom:14px}
.big1 .v{font-size:32px;font-weight:800;margin:6px 0}
.spin{display:inline-block;width:18px;height:18px;border:2.5px solid var(--line);border-top-color:var(--pri);border-radius:50%;animation:s .8s linear infinite;vertical-align:-3px}
@keyframes s{to{transform:rotate(360deg)}}
.loading{position:fixed;top:calc(10px + env(safe-area-inset-top));right:14px;z-index:40}
.setup{min-height:90vh;display:flex;flex-direction:column;justify-content:center}
.logo{width:72px;height:72px;border-radius:20px;background:linear-gradient(135deg,var(--pri),var(--pri2));display:grid;place-items:center;font-size:38px;margin-bottom:12px;box-shadow:0 10px 30px rgba(79,70,229,.3)}
details summary{cursor:pointer;list-style:none}details summary::-webkit-details-marker{display:none}
</style>

<div id="app"></div>
<div class="sheetbg" id="sheetbg"></div>
<div class="sheet" id="sheet"></div>
<div class="toast" id="toast"></div>
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js" defer></script>
<script>
// Lê a fatura exportada do Bradesco Internet Banking (.xls) já convertida em matriz de linhas.
// Retorna { linhas:[{cartao,titular,data,descricao,valor,usd}], cartoes:[{cartao,titular,total}], total, mesSugerido }
function lerFaturaBradesco(rows, hojeISO, fechamento) {
  var linhas = [], cartoes = [], atual = null, total = null, colBRL = 3, colUSD = 2, colHist = 1;
  function ultimo(c) { for (var i = c.length - 1; i >= 1; i--) if (c[i]) return c[i]; return ''; }
  function txt(v) { return v === null || v === undefined ? '' : String(v).trim(); }
  function numBR(v) {
    if (typeof v === 'number') return v;
    var s = txt(v); if (!s) return 0;
    if (s.indexOf(',') >= 0) s = s.replace(/\./g, '').replace(',', '.');
    var n = parseFloat(s); return isNaN(n) ? 0 : n;
  }
  rows.forEach(function (r) {
    var c = (r || []).map(txt);
    var a = c[0] || '';
    var cab = a.match(/^(.+?)\s+-\s+(\d{4})$/);
    if (cab && !c.slice(1).join('')) { atual = { cartao: cab[2], titular: cab[1], total: 0 }; cartoes.push(atual); return; }
    if (/^Data$/i.test(a)) {
      c.forEach(function (h, i) {
        if (/hist/i.test(h)) colHist = i;
        else if (/US\$/i.test(h)) colUSD = i;
        else if (/R\$/i.test(h)) colBRL = i;
      });
      return;
    }
    if (/^Total da fatura em Real/i.test(a)) { total = numBR(ultimo(c)); return; }
    if (/^\d{2}\/\d{2}$/.test(a) && atual) {
      var desc = (c[colHist] || '').replace(/\s+/g, ' ');
      var valor = numBR(c[colBRL]);
      linhas.push({ cartao: atual.cartao, titular: atual.titular, data: a, descricao: desc, valor: valor, usd: numBR(c[colUSD]) });
      if (!/SALDO ANTERIOR|PAGTO\.? POR DEB/i.test(desc)) atual.total = Math.round((atual.total + valor) * 100) / 100;
    }
  });
  // mês sugerido: compra mais recente (à vista) + regra de fechamento
  var hoje = hojeISO || new Date().toISOString().slice(0, 10);
  var melhor = null;
  linhas.forEach(function (l) {
    if (/SALDO ANTERIOR|PAGTO/i.test(l.descricao)) return;
    if (/\s(\d{1,2})\/(\d{1,2})$/.test(l.descricao) && !/\s1\/\d{1,2}$/.test(l.descricao)) return;
    var d = +l.data.slice(0, 2), m = +l.data.slice(3, 5), y = +hoje.slice(0, 4);
    var iso = y + '-' + (m < 10 ? '0' : '') + m + '-' + l.data.slice(0, 2);
    if (iso > hoje) { y -= 1; iso = y + iso.slice(4); }
    if (!melhor || iso > melhor) melhor = iso;
  });
  var mesSugerido = '';
  if (melhor) {
    var dia = +melhor.slice(8, 10), yy = +melhor.slice(0, 4), mm = +melhor.slice(5, 7) + (dia < (+fechamento || 29) ? 1 : 2);
    while (mm > 12) { mm -= 12; yy++; }
    mesSugerido = yy + '-' + (mm < 10 ? '0' : '') + mm;
  }
  return { linhas: linhas, cartoes: cartoes, total: total, mesSugerido: mesSugerido };
}
if (typeof module !== 'undefined') module.exports = { lerFaturaBradesco: lerFaturaBradesco };

</script>
<script>
'use strict';
// ============ COLE AQUI o URL do app da Web do Apps Script (termina em /exec) ============
const SERVIDOR = 'https://script.google.com/macros/s/AKfycbyyBbDiSVytfi5nVsayi1DUmfy6j01BGjBO96bRgNnO4UiCrUe59v44VPM793-NAkv2/exec';
const VERSAO_APP = '2.2';
const SERVIDOR_MINIMO = '2.2';
function versaoMenor(a, b) { const x = String(a || '0').split('.').map(Number), y = String(b).split('.').map(Number); for (let i = 0; i < 3; i++) { if ((x[i] || 0) !== (y[i] || 0)) return (x[i] || 0) < (y[i] || 0); } return false; }
function quando(iso) { if (!iso) return ''; const d = new Date(iso); return d.toLocaleDateString('pt-BR') + ' às ' + d.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' }); }
function faturaDoMes(m) { return ((S.dados && S.dados.faturas) || []).find(h => h.mes === m); }
// ---------- estado e utilidades ----------
const LS = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} }
};
const S = {
  cfg: LS.get('sessao', null), tab: 'inicio', sub: null, mes: hojeMes(), dados: null, cache: {},
  filtro: 'todos', busca: '', filtroCat: '', lote: null, resultados: null, carregando: false
};
const BALDES = ['ESSENCIAL', 'PARA NÓS', 'APOSENTADORIA', 'OBJETIVOS'];
const COR = { 'ESSENCIAL': 'var(--b3)', 'PARA NÓS': 'var(--b2)', 'APOSENTADORIA': 'var(--b1)', 'OBJETIVOS': 'var(--b4)', 'SEM CATEGORIA': '#9ca3af' };
const NOME_BALDE = { 'ESSENCIAL': 'Essencial', 'PARA NÓS': 'Para nós', 'APOSENTADORIA': 'Aposentadoria', 'OBJETIVOS': 'Objetivos', 'SEM CATEGORIA': 'Sem categoria' };
const MESES = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const fmt = new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' });
const brl = v => fmt.format(+v || 0);
const brl0 = v => fmt.format(Math.round(+v || 0)).replace(/,00$/, '');
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const $ = s => document.querySelector(s);
function hojeMes() { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0'); }
function hojeISO() { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function somaMes(m, k) { let y = +m.slice(0, 4), mm = +m.slice(5, 7) - 1 + k; y += Math.floor(mm / 12); mm = ((mm % 12) + 12) % 12; return y + '-' + String(mm + 1).padStart(2, '0'); }
function nomeMes(m, curto) { const n = MESES[+m.slice(5, 7) - 1]; return curto ? n.slice(0, 3) : n + ' ' + m.slice(0, 4); }
function dataBonita(iso) {
  if (!iso) return '';
  const d = new Date(iso + 'T12:00:00'), h = new Date(); h.setHours(12, 0, 0, 0);
  const diff = Math.round((h - d) / 864e5);
  if (diff === 0) return 'hoje'; if (diff === 1) return 'ontem';
  return d.toLocaleDateString('pt-BR', { weekday: 'short', day: '2-digit', month: 'short' });
}
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('on'), 2600); }
function catInfo(nome) { return (S.dados && S.dados.categorias.find(c => c.nome === nome)) || { nome: nome || 'Sem categoria', icone: '❓', balde: '' }; }
function baldeDe(l) { if (!l.categoria) return 'SEM CATEGORIA'; return catInfo(l.categoria).balde || 'ESSENCIAL'; }

// ---------- API ----------
async function apiGet(params) {
  const u = new URL(S.cfg.url);
  Object.entries(Object.assign({}, params, { token: S.cfg.token })).forEach(([k, v]) => u.searchParams.set(k, v));
  const r = await fetch(u.toString(), { redirect: 'follow' });
  return checar(await r.json());
}
async function apiPost(body) {
  return checar(await postSem(S.cfg.url, Object.assign({}, body, { token: S.cfg.token })));
}
async function postSem(url, body) {
  const r = await fetch(url, { method: 'POST', redirect: 'follow', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body) });
  return r.json();
}
function checar(j) {
  if (j.erro === 'Sessão expirada') { sair(true); throw new Error('Sua sessão expirou. Entre de novo.'); }
  if (j.erro) throw new Error(j.erro);
  return j;
}
function servidor() { return /^https:\/\//.test(SERVIDOR) ? SERVIDOR : LS.get('servidor', ''); }
function setLoading(on) {
  S.carregando = on;
  let el = $('#loading');
  if (on && !el) { el = document.createElement('div'); el.id = 'loading'; el.className = 'loading'; el.innerHTML = '<span class="spin"></span>'; document.body.appendChild(el); }
  if (!on && el) el.remove();
}
async function carregar(mes, silencioso) {
  S.mes = mes || S.mes;
  if (S.cache[S.mes]) { S.dados = S.cache[S.mes]; render(); }
  else { const c = LS.get('cache_' + S.mes, null); if (c) { S.dados = c; render(); } }
  if (!silencioso) setLoading(true);
  try {
    const d = await apiGet({ action: 'dados', mes: S.mes });
    S.cache[S.mes] = d; S.dados = d; LS.set('cache_' + S.mes, d);
    render();
  } catch (e) {
    if (!S.dados) { S.erro = e.message; render(); } else toast('Sem conexão: ' + e.message);
  } finally { setLoading(false); }
}
function invalidar() { S.cache = {}; }
async function acao(body, msg) {
  setLoading(true);
  try { const r = await apiPost(body); invalidar(); if (msg) toast(msg); await carregar(S.mes, true); return r; }
  catch (e) { toast('Erro: ' + e.message); throw e; }
  finally { setLoading(false); }
}

// ---------- cálculo do mês ----------
function resumo(d) {
  const L = d.lancamentos;
  let rec = 0, desp = 0; const porBalde = {}, porCat = {};
  L.forEach(l => {
    const v = +l.valor || 0;
    if (l.tipo === 'receita') { rec += v; return; }
    desp += v;
    const b = baldeDe(l); porBalde[b] = (porBalde[b] || 0) + v;
    const c = l.categoria || 'Sem categoria'; porCat[c] = (porCat[c] || 0) + v;
  });
  return { rec, desp, saldo: rec - desp, porBalde, porCat: Object.entries(porCat).sort((a, b) => b[1] - a[1]) };
}

// ---------- render ----------
const ICON = {
  inicio: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>',
  lanc: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01"/></svg>',
  faturas: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="20" height="14" rx="3"/><path d="M2 10h20M6 15h4"/></svg>',
  mais: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="5" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="19" cy="12" r="1.3"/></svg>'
};
function render() {
  const app = $('#app');
  if (!S.cfg) { app.innerHTML = vLogin(); return; }
  if (!S.dados) {
    app.innerHTML = `<div class="wrap"><div class="empty">${S.erro ? '⚠️ ' + esc(S.erro) + '<br><br><button class="btn sec" onclick="S.erro=null;carregar()">Tentar de novo</button><button class="btn danger" onclick="sair()">Sair</button>' : '<span class="spin"></span>'}</div></div>`;
    return;
  }
  const views = { inicio: vInicio, lanc: vLanc, faturas: vFaturas, mais: vMais };
  app.innerHTML = '<div class="wrap">' + views[S.tab]() + '</div>' + vTabs();
}
function vTabs() {
  const n = S.dados.pendentes.length;
  const b = (id, nome) => `<button class="${S.tab === id ? 'on' : ''}" onclick="irTab('${id}')">${ICON[id]}${id === 'inicio' && n ? `<span class="badge">${n}</span>` : ''}<span>${nome}</span></button>`;
  return `<nav class="tabs">${b('inicio', 'Início')}${b('lanc', 'Lançamentos')}<button class="fab" onclick="abrirNovo()" aria-label="Novo">+</button>${b('faturas', 'Faturas')}${b('mais', 'Mais')}</nav>`;
}
function irTab(t) { S.tab = t; S.sub = null; render(); window.scrollTo(0, 0); }
function mudaMes(k) { carregar(somaMes(S.mes, k)); }
function vMesBar() {
  return `<div class="monthbar"><button onclick="mudaMes(-1)" aria-label="Mês anterior">‹</button><div class="m">${nomeMes(S.mes)}</div><button onclick="mudaMes(1)" aria-label="Próximo mês">›</button></div>`;
}

function vInicio() {
  const d = S.dados, r = resumo(d), ideal = d.config.ideal || {};
  const pend = d.pendentes.length;
  const baldes = BALDES.concat(r.porBalde['SEM CATEGORIA'] ? ['SEM CATEGORIA'] : []).map(b => {
    const v = r.porBalde[b] || 0, pct = r.rec ? v / r.rec * 100 : 0, id = ideal[b];
    return `<div class="bucket"><div class="top"><span><b style="color:${COR[b]}">●</b> ${NOME_BALDE[b]}</span><span><b>${brl0(v)}</b> <span class="muted">· ${pct.toFixed(0)}%${id != null && b !== 'SEM CATEGORIA' ? ' de ' + id + '%' : ''}</span></span></div>
      <div class="bar"><i style="width:${Math.min(100, pct)}%;background:${COR[b]}"></i>${id != null && b !== 'SEM CATEGORIA' ? `<span class="ideal" style="left:${id}%"></span>` : ''}</div></div>`;
  }).join('');
  const max = r.porCat.length ? r.porCat[0][1] : 1;
  const cats = r.porCat.slice(0, 7).map(([c, v]) => { const ci = catInfo(c);
    return `<div class="cat" onclick="filtrarCat('${esc(c)}')"><div class="ico">${ci.icone || '❓'}</div><div class="grow"><div class="row"><span class="grow ell">${esc(c)}</span><b>${brl0(v)}</b></div><div class="mini"><i style="width:${v / max * 100}%"></i></div></div></div>`; }).join('');
  const mx = Math.max(1, ...d.serie.map(s => Math.max(s.despesas, s.receitas)));
  const ano = d.serie.map(s => `<div class="col ${s.mes === S.mes ? 'sel' : ''}" onclick="carregar('${s.mes}')"><div class="stk"><div class="d ${s.despesas > s.receitas ? 'over' : ''}" style="height:${s.despesas / mx * 100}%"></div><div class="r" style="bottom:${s.receitas / mx * 100}%"></div></div><div class="l">${nomeMes(s.mes, 1)[0].toUpperCase()}</div></div>`).join('');
  const saldoAno = d.serie.filter(s => s.mes <= S.mes).reduce((a, s) => a + s.receitas - s.despesas, 0);
  return `<h1>Controle da Casa</h1>${vMesBar()}
    <div class="hero"><div class="lbl">Saldo do mês</div><div class="big">${brl(r.saldo)}</div>
      <div class="duo"><div><span class="lbl">↑ Receitas</span><b>${brl0(r.rec)}</b></div><div><span class="lbl">↓ Despesas</span><b>${brl0(r.desp)}</b></div></div></div>
    ${(() => { const h = faturaDoMes(S.mes); return h
      ? `<button class="alert" style="background:color-mix(in srgb,var(--ok) 14%,var(--card));color:var(--ok)" onclick="irTab('faturas')"><span style="font-size:22px">🧾</span><span>Fatura de ${MESES[+S.mes.slice(5, 7) - 1]} importada<br><span class="small" style="font-weight:500">em ${quando(h.importado_em)} · ${brl0(h.total)}</span></span><span class="go">›</span></button>`
      : (S.mes <= S.dados.hoje ? `<button class="alert" style="background:var(--card);color:var(--sub);box-shadow:var(--shadow)" onclick="irTab('faturas')"><span style="font-size:22px">🧾</span><span>Fatura de ${MESES[+S.mes.slice(5, 7) - 1]} ainda não importada</span><span class="go">›</span></button>` : ''); })()}
    ${pend ? `<button class="alert" onclick="classificar()"><span style="font-size:22px">🔔</span><span>${pend} ${pend > 1 ? 'compras' : 'compra'} para classificar</span><span class="go">›</span></button>` : ''}
    <h2>Divisão pela renda <span style="text-transform:none;letter-spacing:0;font-weight:400">· traço = ideal</span></h2><div class="card">${baldes}</div>
    <h2>Maiores gastos</h2><div class="card">${cats || '<div class="muted">Nenhum gasto neste mês.</div>'}</div>
    <h2>${S.mes.slice(0, 4)} mês a mês</h2><div class="card"><div class="year">${ano}</div>
      <div class="legend"><span><i style="background:var(--pri);opacity:.5"></i>Despesas</span><span><i style="background:var(--ok);height:3px;vertical-align:3px"></i>Receitas</span><span class="grow right">Acumulado: <b class="${saldoAno < 0 ? 'neg' : 'pos'}">${brl0(saldoAno)}</b></span></div></div>`;
}
function filtrarCat(c) { S.filtroCat = c; S.filtro = 'todos'; irTab('lanc'); }

function origemTag(l) {
  if (l.status === 'a_classificar') return '<span class="tag warn">classificar</span>';
  if (l.origem === 'sms') return l.conciliado ? '<span class="tag ok">SMS ✓ fatura</span>' : '<span class="tag sms">SMS</span>';
  if (l.origem === 'fatura') return '<span class="tag ok">fatura</span>';
  if (l.origem === 'fixo') return '<span class="tag">fixo</span>';
  if (l.origem === 'previsto') return '<span class="tag">previsto</span>';
  if (l.origem === 'planilha') return '<span class="tag">planilha</span>';
  return '';
}
function itemHtml(l) {
  const ci = catInfo(l.categoria);
  const sub = [l.categoria || 'Sem categoria', l.pessoa, l.cartao ? '•••• ' + l.cartao : ''].filter(Boolean).join(' · ');
  const semData = l.origem === 'planilha' || l.origem === 'fixo';
  const dt = semData ? '' : (l.data ? l.data.slice(8, 10) + '/' + l.data.slice(5, 7) : '');
  const desc = l.parcela ? String(l.descricao).replace(/\s\d{1,2}\/\d{1,2}\s*$/, '') : l.descricao;
  return `<div class="item" onclick="editar('${esc(l.id)}')"><div class="ico">${l.tipo === 'receita' ? '💰' : (ci.icone || '❓')}</div>
    <div class="grow"><div class="t ell">${esc(desc)}</div><div class="s ell">${esc(sub)}</div><div class="s">${origemTag(l).replace('margin-left:4px', '')}</div></div>
    <div class="right" style="flex:none"><div class="v ${l.tipo === 'receita' ? 'pos' : ''}">${l.tipo === 'receita' ? '+' : '−'}${brl(l.valor).replace('R$', '').trim()}</div>
      <div class="s">${dt}${l.parcela ? `${dt ? ' · ' : ''}<span class="tag parc">${esc(l.parcela)}</span>` : ''}</div></div></div>`;
}
function vLanc() {
  const d = S.dados;
  let L = d.lancamentos.slice();
  const f = S.filtro;
  if (f === 'cartao') L = L.filter(l => l.cartao || ['sms', 'fatura', 'planilha', 'previsto'].includes(l.origem));
  if (f === 'fixos') L = L.filter(l => l.origem === 'fixo');
  if (f === 'receitas') L = L.filter(l => l.tipo === 'receita');
  if (f === 'despesas') L = L.filter(l => l.tipo === 'despesa');
  if (f === 'pend') L = d.pendentes.slice();
  if (f === 'fatura') L = L.filter(l => l.origem === 'fatura' || l.conciliado);
  if (S.filtroCat) L = L.filter(l => (l.categoria || 'Sem categoria') === S.filtroCat);
  if (S.busca) { const q = S.busca.toUpperCase(); L = L.filter(l => (l.descricao + ' ' + l.categoria + ' ' + l.pessoa + ' ' + l.cartao).toUpperCase().includes(q)); }
  L.sort((a, b) => (b.data + b.criado).localeCompare(a.data + a.criado));
  const tot = L.reduce((s, l) => s + (l.tipo === 'receita' ? 1 : -1) * (+l.valor || 0), 0);
  const chip = (id, n) => `<button class="chip ${S.filtro === id ? 'on' : ''}" onclick="S.filtro='${id}';render()">${n}</button>`;
  let html = '', dia = null, grupo = [];
  const fecha = () => { if (grupo.length) html += `<div class="day"${dia[0] === '~' ? ' style="text-transform:none"' : ''}>${titulo(dia)}</div><div class="list">${grupo.join('')}</div>`; grupo = []; };
  const grupoDe = l => l.origem === 'fixo' ? '~fixo' : (l.origem === 'planilha' ? '~planilha' : l.data);
  const titulo = k => k === '~fixo' ? 'Fixos do mês' : (k === '~planilha' ? 'Agrupados da planilha antiga (sem data)' : dataBonita(k));
  L.sort((a, b) => { const ga = grupoDe(a), gb = grupoDe(b); const pa = ga[0] === '~' ? 1 : 0, pb = gb[0] === '~' ? 1 : 0; return pa - pb || gb.localeCompare(ga) || String(b.criado).localeCompare(String(a.criado)); });
  L.forEach(l => { const k = grupoDe(l); if (k !== dia) { fecha(); dia = k; } grupo.push(itemHtml(l)); });
  fecha();
  return `<h1>Lançamentos</h1>${vMesBar()}
    <input class="search" placeholder="Buscar loja, categoria, cartão…" value="${esc(S.busca)}" oninput="S.busca=this.value;clearTimeout(window._b);window._b=setTimeout(()=>{render();const i=document.querySelector('.search');i.focus();i.setSelectionRange(i.value.length,i.value.length)},250)">
    <div class="chips">${chip('todos', 'Todos')}${chip('despesas', 'Despesas')}${chip('cartao', 'Cartão')}${chip('fatura', 'Da fatura')}${chip('fixos', 'Fixos')}${chip('receitas', 'Receitas')}${chip('pend', 'A classificar' + (d.pendentes.length ? ' (' + d.pendentes.length + ')' : ''))}</div>
    ${S.filtroCat ? `<div class="chips"><button class="chip on" onclick="S.filtroCat='';render()">${esc(S.filtroCat)} ✕</button></div>` : ''}
    <div class="sum"><span class="muted">${L.length} lançamentos${f === 'pend' ? ' (todos os meses)' : ''}</span><b class="${tot < 0 ? '' : 'pos'}">${brl(tot)}</b></div>
    ${html || '<div class="empty">Nada por aqui.</div>'}`;
}

// ---------- faturas ----------
function vFaturas() {
  const d = S.dados, lote = S.lote, res = S.resultados;
  let corpo = '';
  if (res) {
    const ok = res.filter(x => x.r), erros = res.filter(x => !x.r);
    const aClass = ok.reduce((s, x) => s + (x.r.a_classificar || 0), 0);
    const semFat = [].concat(...ok.map(x => x.r.sem_fatura || []));
    corpo = `<div class="big1" style="background:color-mix(in srgb,var(--ok) 12%,var(--card))"><div style="font-size:40px">${erros.length ? '⚠️' : '✅'}</div>
        <div class="v" style="font-size:21px;color:${erros.length ? 'var(--warn)' : 'var(--ok)'}">${ok.length === 1 && !erros.length ? 'Fatura importada com sucesso' : ok.length + ' de ' + res.length + ' arquivos importados'}</div>
        <div class="muted">${brl(ok.reduce((s, x) => s + x.r.total, 0))} no total</div></div>
      <div class="list">${res.map(x => x.r
        ? `<div class="item" onclick="verFatura('${x.mes}')"><div class="ico" style="background:color-mix(in srgb,var(--ok) 14%,var(--card))">✅</div><div class="grow"><div class="t" style="text-transform:capitalize">${nomeMes(x.mes)}</div><div class="s">${x.r.conciliados.length} conferidas por SMS · ${x.r.novos} da fatura${x.r.a_classificar ? ' · ' + x.r.a_classificar + ' a classificar' : ''}${x.r.planilha_substituida ? '<br>Substituiu ' + brl(x.r.planilha_substituida) + ' da planilha antiga' : ''}</div></div><div class="right"><div class="v">${brl(x.r.total)}</div>${x.r.total_mes && Math.abs(x.r.total_mes - x.r.total) > 0.01 ? `<div class="s">mês: ${brl(x.r.total_mes)}</div>` : ''}<span class="muted">›</span></div></div>`
        : `<div class="item"><div class="ico">❌</div><div class="grow"><div class="t">${esc(x.nome)}</div><div class="s neg">${esc(x.erro)}</div></div></div>`).join('')}</div>
      <div style="height:12px"></div>
      ${aClass ? `<button class="btn" onclick="classificar()">Classificar ${aClass} compras</button>` : ''}
      ${semFat.length ? `<h2>Chegaram por SMS mas não estão na fatura</h2><div class="list">${semFat.map(itemHtml).join('')}</div><p class="small muted" style="margin:8px 4px">Normalmente são compras feitas perto do fechamento: devem aparecer na próxima fatura.</p>` : ''}
      ${ok.length === 1 ? `<button class="btn sec" onclick="verFatura('${ok[0].mes}')">Ver lançamentos desta fatura</button>` : ''}
      <button class="btn sec" onclick="S.resultados=null;S.lote=null;render()">Importar outras faturas</button>`;
  } else if (lote && lote.length) {
    const cartoesDe = x => x.f.cartoes.map(c => c.cartao);
    corpo = lote.map((x, i) => {
      const f = x.f, qtd = f.linhas.filter(l => !/SALDO ANTERIOR|PAGTO/i.test(l.descricao)).length;
      return `<div class="card" style="margin-bottom:12px"><div class="row"><div class="grow"><div class="muted small ell">📄 ${esc(x.nome)}</div><div style="font-size:24px;font-weight:800;margin:2px 0">${brl(f.total != null ? f.total : f.cartoes.reduce((s, c) => s + c.total, 0))}</div>
          <div class="muted small">${qtd} lançamentos · ${f.cartoes.map(c => esc(primeiro(c.titular)) + ' ' + c.cartao).join(', ')}</div></div>
          <button class="x" onclick="S.lote.splice(${i},1);render()" aria-label="Remover">×</button></div>
        <div class="field" style="margin:12px 0 8px;box-shadow:none;background:var(--chip)"><label>Fatura com vencimento em</label><input type="month" class="mesLote" value="${x.mes}" onchange="S.lote[${i}].mes=this.value;render()"></div>
        ${avisoLote(x, i, cartoesDe)}</div>`;
    }).join('');
    const bloqueado = false;
    corpo += `<p class="small muted" style="margin:0 4px 10px">Em cada mês, os valores que vieram da planilha antiga serão substituídos pelos da fatura, e as compras do SMS serão marcadas como conferidas.</p>
      <button class="btn" id="btnImp" ${bloqueado ? 'disabled' : ''} onclick="importarLote()">${lote.length > 1 ? 'Importar ' + lote.length + ' arquivos' : 'Importar e conferir'}</button>
      <label class="btn sec" style="display:block;text-align:center;box-sizing:border-box">+ Adicionar mais arquivos<input type="file" multiple accept=".xls,.xlsx,.csv,application/vnd.ms-excel" style="display:none" onchange="lerArquivos(this.files,true)"></label>
      <button class="btn danger" onclick="S.lote=null;render()">Cancelar</button>`;
  } else {
    corpo = `<label class="big1 dropzone" id="dropzone" style="display:block;cursor:pointer;border:2px dashed var(--line)"><div style="font-size:40px">📄</div><div class="v" style="font-size:20px">Enviar faturas do Bradesco</div><div class="muted small">Toque para escolher ou arraste os arquivos .xls aqui.<br>Pode enviar vários arquivos e vários meses de uma vez.</div><input type="file" multiple accept=".xls,.xlsx,.csv,application/vnd.ms-excel" style="display:none" onchange="lerArquivos(this.files)"></label>
      <details class="card small"><summary><b>Como baixar a fatura</b> <span class="muted">›</span></summary><p class="muted">No site do Bradesco (Internet Banking) → Cartões → Fatura → escolha o mês → botão <b>Salvar em Excel</b>. No iPhone o arquivo vai para o app Arquivos; é só escolhê-lo aqui.</p></details>`;
  }
  const lista = (d.faturas || []).slice().sort((a, b) => b.mes.localeCompare(a.mes));
  const hist = lista.map(h => `<div class="item" onclick="verFatura('${h.mes}')"><div class="ico" style="background:color-mix(in srgb,var(--ok) 14%,var(--card))">✅</div><div class="grow"><div class="t" style="text-transform:capitalize">${nomeMes(h.mes)}</div><div class="s">Importada em ${quando(h.importado_em)}<br>${h.conciliados} conferidas por SMS · ${h.novos} vindas da fatura${h.cartoes ? '<br>Cartões: ' + esc(String(h.cartoes).split(',').join(', ')) : ''}</div></div><div class="right"><div class="v">${brl(h.total)}</div><span class="muted">›</span></div></div>`).join('');
  return `<h1>Faturas</h1><p class="muted" style="margin:0 4px 14px">Confira a fatura com as compras que chegaram por SMS.</p>${corpo}
    <h2>Faturas importadas${lista.length ? ' (' + lista.length + ')' : ''}</h2>${hist ? `<div class="list">${hist}</div>` : '<div class="card muted small">Nenhuma fatura importada ainda.</div>'}`;
}
function avisoLote(x, i, cartoesDe) {
  const meus = cartoesDe(x);
  const outros = S.lote.filter((y, j) => j !== i && y.mes === x.mes);
  const repetido = outros.find(y => cartoesDe(y).some(c => meus.includes(c)));
  if (repetido) return `<div class="alert" style="margin:0;cursor:default;background:#fee2e2;color:var(--bad)"><span>❗</span><span>Este arquivo e "${esc(repetido.nome)}" têm os mesmos cartões em ${nomeMes(x.mes)}. Confira o mês ou remova um deles (×).</span></div>`;
  let html = '';
  if (outros.length) html += `<div class="alert" style="margin:0 0 8px;cursor:default;background:color-mix(in srgb,var(--pri) 10%,var(--card));color:var(--pri)"><span>➕</span><span>Faz parte da fatura de ${nomeMes(x.mes)} junto com ${outros.map(y => '"' + esc(y.nome) + '"').join(', ')} (outros cartões). Os valores serão somados.</span></div>`;
  const h = faturaDoMes(x.mes);
  if (h) {
    const ja = String(h.cartoes || '').split(',').filter(Boolean);
    const comuns = meus.filter(c => ja.includes(c));
    if (!ja.length || comuns.length) html += `<div class="alert" style="margin:0;cursor:default"><span style="font-size:20px">⚠️</span><span>${ja.length ? 'Os cartões ' + comuns.join(', ') + ' de' : 'A fatura de'} ${nomeMes(x.mes)} já foram importados em ${quando(h.importado_em)}.<br><span class="small" style="font-weight:500">Importar de novo substitui esses cartões, sem duplicar.</span></span></div>`;
    else html += `<div class="alert" style="margin:0;cursor:default;background:color-mix(in srgb,var(--pri) 10%,var(--card));color:var(--pri)"><span>➕</span><span>${nomeMes(x.mes)} já tem os cartões ${ja.join(', ')} importados. Este arquivo traz outros cartões e será somado.</span></div>`;
  }
  return html;
}
function avisoJaHtml(m) {
  const h = faturaDoMes(m);
  return h ? `<div class="alert" style="margin:0;cursor:default"><span style="font-size:20px">⚠️</span><span>A fatura de ${nomeMes(m)} já foi importada em ${quando(h.importado_em)}.<br><span class="small" style="font-weight:500">Importar de novo substitui a anterior, sem duplicar.</span></span></div>` : '';
}

function primeiro(s) { const p = String(s || '').split(' ')[0]; return p.charAt(0) + p.slice(1).toLowerCase(); }
async function esperarLeitor() {
  for (let i = 0; i < 50 && !window.XLSX; i++) await new Promise(r => setTimeout(r, 200));
  if (!window.XLSX) throw new Error('Não consegui carregar o leitor de Excel. Verifique a internet e tente de novo.');
}
async function lerArquivos(files, somar) {
  files = Array.from(files || []).filter(f => /\.(xls|xlsx|csv)$/i.test(f.name) || /excel|spreadsheet|csv/.test(f.type));
  if (!files.length) { toast('Escolha arquivos .xls da fatura do Bradesco'); return; }
  S.tab = 'faturas'; S.resultados = null;
  if (!somar || !S.lote) S.lote = [];
  try { await esperarLeitor(); } catch (e) { toast(e.message); return; }
  const ruins = [];
  for (const file of files) {
    try {
      const buf = await file.arrayBuffer();
      const wb = XLSX.read(buf, { type: 'array' });
      const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1, raw: false, defval: '' });
      const f = lerFaturaBradesco(rows, hojeISO(), +S.dados.config.fechamento || 29);
      if (!f.linhas.length) { ruins.push(file.name); continue; }
      S.lote.push({ nome: file.name, f, mes: f.mesSugerido || S.mes });
    } catch (e) { ruins.push(file.name); }
  }
  S.lote.sort((a, b) => a.mes.localeCompare(b.mes));
  render(); window.scrollTo(0, 0);
  if (ruins.length) toast('Não reconheci como fatura do Bradesco: ' + ruins.join(', '));
}
async function importarLote() {
  const lote = S.lote.slice(), b = $('#btnImp'), out = [];
  b.disabled = true;
  setLoading(true);
  for (let i = 0; i < lote.length; i++) {
    b.innerHTML = `<span class="spin"></span> Importando ${i + 1} de ${lote.length}…`;
    try { out.push({ mes: lote[i].mes, nome: lote[i].nome, r: await apiPost({ action: 'fatura', mes: lote[i].mes, linhas: lote[i].f.linhas }) }); }
    catch (e) { out.push({ mes: lote[i].mes, nome: lote[i].nome, erro: e.message }); }
  }
  setLoading(false);
  invalidar(); await carregar(S.mes, true);
  S.lote = null; S.resultados = out; render(); window.scrollTo(0, 0);
  toast(out.every(x => x.r) ? (out.length > 1 ? out.length + ' arquivos importados' : 'Fatura importada') : 'Alguns arquivos não foram importados');
}

['dragenter', 'dragover'].forEach(ev => window.addEventListener(ev, e => {

function acharLanc(id) { return S.dados.lancamentos.find(l => l.id === id) || S.dados.pendentes.find(l => l.id === id); }
function sugerePadrao(desc) {
  let t = String(desc).toUpperCase().replace(/\s\d{1,2}\/\d{1,2}$/, '').trim();

  if ((p.length < 6 || /^(MP\*|EC|IFD\*|PG \*|PAG\*|STORE|LOJA|SHOP)/.test(p)) && tk[1]) p = tk[0] + ' ' + tk[1];
  if (p.includes('-') && p.split('-')[0].length >= 5) p = p.split('-')[0];
  return p;
}

    <div class="chk" id="regraBox" style="display:${l.categoria ? 'none' : 'flex'}"><input type="checkbox" id="er" ${l.categoria ? '' : 'checked'}><span>Sempre que tiver <input type="text" id="ep" value="${esc(sugerePadrao(l.descricao))}"> usar esta categoria</span></div>
    <div class="row" style="gap:10px"><div class="field grow"><label>Mês de referência</label><input id="em" type="month" value="${l.mes}"></div><div class="field grow"><label>Pessoa</label><input id="epe" value="${esc(l.pessoa)}"></div></div>
    <p class="small muted" style="margin:0 4px 10px">${esc([dataBonita(l.data), l.cartao ? '•••• ' + l.cartao : '', l.parcela ? 'parcela ' + l.parcela : '', 'origem: ' + l.origem, l.conciliado ? 'conferido na fatura de ' + nomeMes(String(l.conciliado).split('|')[0]) : ''].filter(Boolean).join(' · '))}</p>
    <button class="btn" onclick="salvarEd('${esc(l.id)}')">Salvar</button><button class="btn danger" onclick="if(confirm('Excluir este lançamento?')){closeSheet();acao({action:'excluir',id:'${esc(l.id)}'},'Excluído')}">Excluir</button>`);
}
function marcaCatEd(nome, el) { marcaCat(nome, el); $('#regraBox').style.display = 'flex'; }
async function salvarEd(id) {
  const campos = { valor: $('#ev').value, descricao: $('#ed').value, mes: $('#em').value, pessoa: $('#epe').value };
  const cat = selCat($('#sheet')); if (cat) campos.categoria = cat;
  const b = { action: 'atualizar', id, campos };
  if (cat && $('#er').checked && $('#ep').value.trim()) b.regra = { padrao: $('#ep').value.trim() };
  closeSheet();
  const r = await acao(b, 'Salvo');
  if (r && r.aplicados) toast(`Salvo · regra aplicada a mais ${r.aplicados}`);
}

// classificar pendentes, um por um
function classificar() {
  const P = S.dados.pendentes;
  if (!P.length) { closeSheet(); toast('Tudo classificado 🎉'); return; }
  const l = P[0];
  openSheet(`<h3>Classificar <span class="muted small" style="font-weight:500">${P.length} restante${P.length > 1 ? 's' : ''}</span><button class="x" onclick="closeSheet()">×</button></h3>
    <div class="big1"><div class="muted small">${esc([dataBonita(l.data), l.pessoa, l.cartao ? '•••• ' + l.cartao : '', l.parcela].filter(Boolean).join(' · '))}</div><div class="v">${brl(l.valor)}</div><div style="font-weight:700">${esc(l.descricao)}</div></div>
    ${catGrid(l.tipo, '', 'escolheClass')}
    <div class="chk"><input type="checkbox" id="cr" checked><span>Lembrar para <input type="text" id="cp" value="${esc(sugerePadrao(l.descricao))}"></span></div>
    <button class="btn sec" onclick="pularClass()">Pular</button>`);
  $('#sheet').dataset.id = l.id;
}
async function escolheClass(nome, el) {
  marcaCat(nome, el);
  const id = $('#sheet').dataset.id;
  const b = { action: 'atualizar', id, campos: { categoria: nome } };
  if ($('#cr').checked && $('#cp').value.trim()) b.regra = { padrao: $('#cp').value.trim() };
  const P = S.dados.pendentes;
  S.dados.pendentes = P.filter(x => x.id !== id);
  setLoading(true);
  try { const r = await apiPost(b); invalidar(); if (r.aplicados) { toast(`+${r.aplicados} classificada(s) pela regra`); } await carregar(S.mes, true); }
  catch (e) { toast('Erro: ' + e.message); }
  finally { setLoading(false); }
  classificar();
}
function pularClass() { const P = S.dados.pendentes; P.push(P.shift()); classificar(); }

// fixos
function editarRec(id) {
  const r = S.dados.recorrentes.find(x => x.id === id) || { id: '', tipo: 'despesa', descricao: '', valor: '', categoria: '', pessoa: '', inicio: S.mes, fim: '' };
  openSheet(`<h3>${id ? 'Editar fixo' : 'Novo fixo'}<button class="x" onclick="closeSheet()">×</button></h3>
    <div class="seg"><button class="${r.tipo === 'despesa' ? 'on' : ''}" onclick="this.parentNode.dataset.t='despesa';this.classList.add('on');this.nextElementSibling.classList.remove('on')">Despesa</button><button class="${r.tipo === 'receita' ? 'on' : ''}" onclick="this.parentNode.dataset.t='receita';this.classList.add('on');this.previousElementSibling.classList.remove('on')">Receita</button></div>
    <div class="field"><label>Valor mensal</label><input id="rv" class="money" inputmode="decimal" value="${String(r.valor).replace('.', ',')}"></div>
    <div class="field"><label>Descrição</label><input id="rd" value="${esc(r.descricao)}"></div>
    <div class="field"><label>Categoria</label><select id="rc">${S.dados.categorias.map(c => `<option ${c.nome === r.categoria ? 'selected' : ''}>${esc(c.nome)}</option>`).join('')}</select></div>
    <div class="row" style="gap:10px"><div class="field grow"><label>Início</label><input id="ri" type="month" value="${r.inicio}"></div><div class="field grow"><label>Fim (vazio = sem fim)</label><input id="rf" type="month" value="${r.fim}"></div></div>
    <div class="field"><label>Pessoa</label><input id="rp" value="${esc(r.pessoa)}"></div>
    <button class="btn" onclick="salvarRec('${r.id}','${r.tipo}')">Salvar</button>${id ? `<button class="btn danger" onclick="if(confirm('Excluir este fixo de todos os meses?')){closeSheet();acao({action:'recorrente_excluir',id:'${r.id}'},'Excluído')}">Excluir</button>` : ''}`);
}
function salvarRec(id, tipo0) {
  const tipo = $('#sheet .seg').dataset.t || tipo0;
  const item = { id, tipo, valor: $('#rv').value, descricao: $('#rd').value, categoria: $('#rc').value, inicio: $('#ri').value, fim: $('#rf').value, pessoa: $('#rp').value };
  if (!item.valor || !item.inicio) return toast('Preencha valor e início');
  closeSheet(); acao({ action: 'recorrente_salvar', item }, 'Salvo');
}

// ---------- início ----------
(function boot() {
  render();
  if (S.cfg) carregar(S.mes);
  document.addEventListener('visibilitychange', () => { if (!document.hidden && S.cfg) { invalidar(); carregar(S.mes, true); } });
})();
</script>
</body>
</html>
